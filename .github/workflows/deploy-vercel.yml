name: Vérification du code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Structure et syntaxe
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les fichiers, ressources PWA et routes Vercel
        run: npm run check:code

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check scripts/check-code.mjs
          find api netlify -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check

# Le projet Vercel est relié au dépôt GitHub : Vercel crée les déploiements
# Preview/Production à partir des commits. Ce workflow vérifie le code sans
# dépendre d'un ancien token Vercel ni lancer un second déploiement concurrent.
